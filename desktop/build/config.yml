version: '3'

dev_mode:
  root_path: .
  log_level: warn
  debounce: 750
  ignore:
    dir: [.git, .task, frontend, bin]
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: task build
      type: blocking
    # 保留 Wails 识别的标准命令，以便等待 Vite 就绪后再启动原生窗口。
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: task run
      type: primary
      exit_policy: shutdown
