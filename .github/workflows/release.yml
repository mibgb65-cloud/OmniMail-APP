name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!*-alpha.*'
      - '!*.alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已推送的远端标签名（prod 正式版 vX.Y.Z 或 test 测试版 vX.Y.Z-beta.N；alpha 标签不线上打包）
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验发布标签语义、所属分支与版本更新文档
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin prod:refs/remotes/origin/prod test:refs/remotes/origin/test --tags --force

          $isDispatch = "${{ github.event_name }}" -eq "workflow_dispatch"
          $tag = if ($isDispatch) { $env:INPUT_TAG.Trim() } else { "${{ github.ref_name }}".Trim() }

          if ($tag -match '[.-]alpha\.') {
            Write-Host "检测到 alpha 标签 '$tag'：按分支治理规范仅保留标签，跳过线上打包。"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }

          $tagSha = (git rev-list -n 1 "refs/tags/$tag" 2>$null)
          if ($LASTEXITCODE -ne 0 -or -not $tagSha) {
            throw "远端未找到标签 'refs/tags/$tag'，请先在对应分支创建并推送标签。"
          }
          $tagSha = $tagSha.Trim()

          $stableRegex = '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)$'
          $betaRegex   = '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)[.-]beta\.(?<pre>[1-9]\d*)$'

          if ($tag -match $stableRegex) {
            $channel = "stable"
            $pkgVer = "v$($Matches.major).$($Matches.minor).$($Matches.patch)"
            git merge-base --is-ancestor $tagSha refs/remotes/origin/prod
            if ($LASTEXITCODE -ne 0) {
              throw "正式生产版标签 '$tag' ($tagSha) 不属于 prod 分支提交历史，已拒绝发版。"
            }
          } elseif ($tag -match $betaRegex) {
            $channel = "beta"
            $pkgVer = "v$($Matches.major).$($Matches.minor).$($Matches.patch).beta.$($Matches.pre)"
            git merge-base --is-ancestor $tagSha refs/remotes/origin/test
            if ($LASTEXITCODE -ne 0) {
              throw "Beta 测试版标签 '$tag' ($tagSha) 不属于 test 分支提交历史，已拒绝发版。"
            }
          } else {
            throw "非法发布标签 '$tag'。仅支持 prod 正式版 vX.Y.Z 或 test 测试版 vX.Y.Z-beta.N。"
          }

          git checkout --detach $tagSha
          if ($LASTEXITCODE -ne 0) { throw "检出标签提交 $tagSha 失败" }

          $notesFile = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notesFile) -or (Get-Item -LiteralPath $notesFile).Length -lt 20) {
            throw "缺少版本更新文档 '$notesFile'。按项目发版规范，必须先在 docs/releases/ 新增对应版本更新文档并合入目标分支，再推送标签触发机器人发版。"
          }

          $pkgFile = "OmniMail-windows-Setup-$pkgVer.exe"
          "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sha=$tagSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "pkg_file=$pkgFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "notes_file=$notesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Verified release tag: tag=$tag sha=$tagSha channel=$channel pkg_file=$pkgFile notes=$notesFile"

      - uses: actions/setup-go@v5
        if: steps.meta.outputs.skip != 'true'
        with:
          go-version: '1.26.x'
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v4
        if: steps.meta.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc

      - name: 安装 pnpm、Task、Wails 与 NSIS
        if: steps.meta.outputs.skip != 'true'
        shell: pwsh
        run: |
          npm install -g pnpm@12.6.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            choco install nsis -y --no-progress
          }

      - name: 执行全量门禁验证并构建带 OmniMail 签名的 Windows NSIS 安装包
        if: steps.meta.outputs.skip != 'true'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          WINDOWS_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_PFX_BASE64)) {
            throw "缺少仓库密钥 WINDOWS_SIGN_PFX_BASE64，无法为发布包签入 OmniMail 发布者证书。"
          }
          task verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File ./desktop/build/windows/package-windows.ps1 `
            -Version "${{ steps.meta.outputs.tag }}" `
            -ReleaseRepo "${{ github.repository }}"

          $exe = "dist/release/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.pkg_file }}"
          $sig = Get-AuthenticodeSignature -FilePath $exe
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch "CN=OmniMail") {
            throw "构建产物未通过 CN=OmniMail 数字签名复核：$exe"
          }
          Write-Host "Verified installer signature: $($sig.SignerCertificate.Subject) ($($sig.SignerCertificate.Thumbprint))"

      - name: 由机器人读取更新文档自动创建并发布 GitHub Release
        if: steps.meta.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag   = "${{ steps.meta.outputs.tag }}"
          $sha   = "${{ steps.meta.outputs.sha }}"
          $ch    = "${{ steps.meta.outputs.channel }}"
          $notes = "${{ steps.meta.outputs.notes_file }}"
          $dir   = "dist/release/$tag"
          $exe   = "$dir/${{ steps.meta.outputs.pkg_file }}"
          $sum   = "$dir/SHA256SUMS.txt"

          if (-not (Test-Path -LiteralPath $exe)) { throw "未找到安装包产物：$exe" }
          if (-not (Test-Path -LiteralPath $sum)) { throw "未找到校验文件：$sum" }

          gh release view $tag >$null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sum --clobber
            gh release edit $tag --title "OmniMail $tag" --notes-file $notes
          } else {
            $flags = @("--notes-file", $notes, "--target", $sha, "--title", "OmniMail $tag")
            if ($ch -eq "beta") { $flags += "--prerelease" } else { $flags += "--latest" }
            gh release create $tag $exe $sum @flags
          }
